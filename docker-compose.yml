services:
  db:
    image: postgres:16
    container_name: l14-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 10s
      retries: 5
    ports:
      - "5433:5432"
    volumes:
      - ./app/pgdata:/var/lib/postgresql/data
    networks:
      - internal

networks:
  internal:
    driver: bridge